<!-- category-tabs.component.html -->
<div class="category-tabs">
  @for (cat of categories; track cat) {
    <div
      class="category-tab"
      [class.active]="store.selectedCategory() === cat"
      (click)="select(cat)"
    >
      <span class="icon">🍽️</span>
      <div class="text">
        <strong>{{ cat }}</strong>
        <small>12 Menu In Stock</small>
      </div>
    </div>
  }
</div>
