<svg viewBox="0 0 64 64" [style.width]="size" [style.height]="size">
  <ng-container [ngSwitch]="type">
    <ng-container *ngSwitchCase="'sunny'">
      <circle cx="32" cy="32" r="12" fill="#FACC15" />
      <g stroke="#FACC15" stroke-width="2.5" stroke-linecap="round">
        <line x1="32" y1="9" x2="32" y2="4" />
        <line x1="32" y1="55" x2="32" y2="60" />
        <line x1="9" y1="32" x2="4" y2="32" />
        <line x1="55" y1="32" x2="60" y2="32" />
        <line x1="16" y1="16" x2="12" y2="12" />
        <line x1="48" y1="48" x2="52" y2="52" />
        <line x1="48" y1="16" x2="52" y2="12" />
        <line x1="16" y1="48" x2="12" y2="52" />
      </g>
    </ng-container>

    <ng-container *ngSwitchCase="'partly-cloudy'">
      <circle cx="26" cy="28" r="10" fill="#FACC15" />
      <ellipse cx="36" cy="36" rx="16" ry="10" fill="white" stroke="#ccc" stroke-width="0.5" />
      <ellipse cx="22" cy="39" rx="10" ry="7" fill="white" stroke="#ccc" stroke-width="0.5" />
    </ng-container>

    <ng-container *ngSwitchCase="'cloudy'">
      <ellipse cx="36" cy="28" rx="18" ry="11" fill="#B4B2A9" />
      <ellipse cx="20" cy="33" rx="12" ry="9" fill="#B4B2A9" />
      <ellipse cx="42" cy="36" rx="10" ry="8" fill="#888780" />
    </ng-container>

    <ng-container *ngSwitchCase="'fog'">
      <line
        x1="10"
        y1="22"
        x2="54"
        y2="22"
        stroke="#B4B2A9"
        stroke-width="3"
        stroke-linecap="round"
      />
      <line
        x1="10"
        y1="30"
        x2="54"
        y2="30"
        stroke="#B4B2A9"
        stroke-width="3"
        stroke-linecap="round"
      />
      <line
        x1="10"
        y1="38"
        x2="54"
        y2="38"
        stroke="#B4B2A9"
        stroke-width="3"
        stroke-linecap="round"
      />
      <line
        x1="10"
        y1="46"
        x2="54"
        y2="46"
        stroke="#B4B2A9"
        stroke-width="3"
        stroke-linecap="round"
      />
    </ng-container>

    <ng-container *ngSwitchCase="'rain'">
      <ellipse cx="32" cy="24" rx="16" ry="10" fill="#888780" />
      <ellipse cx="18" cy="29" rx="10" ry="8" fill="#888780" />
      <line
        x1="24"
        y1="42"
        x2="22"
        y2="52"
        stroke="#378ADD"
        stroke-width="2"
        stroke-linecap="round"
      />
      <line
        x1="32"
        y1="42"
        x2="30"
        y2="52"
        stroke="#378ADD"
        stroke-width="2"
        stroke-linecap="round"
      />
      <line
        x1="40"
        y1="42"
        x2="38"
        y2="52"
        stroke="#378ADD"
        stroke-width="2"
        stroke-linecap="round"
      />
      <line
        x1="28"
        y1="52"
        x2="26"
        y2="60"
        stroke="#378ADD"
        stroke-width="2"
        stroke-linecap="round"
      />
      <line
        x1="36"
        y1="52"
        x2="34"
        y2="60"
        stroke="#378ADD"
        stroke-width="2"
        stroke-linecap="round"
      />
    </ng-container>

    <ng-container *ngSwitchCase="'thunder'">
      <ellipse cx="32" cy="22" rx="18" ry="11" fill="#5F5E5A" />
      <ellipse cx="18" cy="27" rx="10" ry="8" fill="#5F5E5A" />
      <polygon points="34,34 26,46 32,46 28,58 40,42 34,42" fill="#FACC15" />
    </ng-container>

    <ng-container *ngSwitchCase="'snow'">
      <ellipse cx="32" cy="24" rx="16" ry="10" fill="#B4B2A9" />
      <circle cx="24" cy="44" r="2.5" fill="#85B7EB" />
      <circle cx="32" cy="40" r="2.5" fill="#85B7EB" />
      <circle cx="40" cy="44" r="2.5" fill="#85B7EB" />
      <circle cx="28" cy="54" r="2.5" fill="#85B7EB" />
      <circle cx="36" cy="54" r="2.5" fill="#85B7EB" />
    </ng-container>

    <ng-container *ngSwitchCase="'night'">
      <path d="M38 14 A18 18 0 1 0 38 50 A12 12 0 1 1 38 14Z" fill="#888780" />
      <circle cx="44" cy="14" r="2" fill="#FACC15" />
      <circle cx="50" cy="22" r="1.5" fill="#FACC15" />
      <circle cx="40" cy="8" r="1.5" fill="#FACC15" />
    </ng-container>

    <ng-container *ngSwitchCase="'night-rain'">
      <path d="M34 12 A16 16 0 1 0 34 44 A11 11 0 1 1 34 12Z" fill="#5F5E5A" />
      <line
        x1="22"
        y1="48"
        x2="20"
        y2="56"
        stroke="#378ADD"
        stroke-width="2"
        stroke-linecap="round"
      />
      <line
        x1="30"
        y1="48"
        x2="28"
        y2="56"
        stroke="#378ADD"
        stroke-width="2"
        stroke-linecap="round"
      />
      <line
        x1="38"
        y1="48"
        x2="36"
        y2="56"
        stroke="#378ADD"
        stroke-width="2"
        stroke-linecap="round"
      />
    </ng-container>

    <ng-container *ngSwitchDefault>
      <ellipse cx="32" cy="30" rx="18" ry="11" fill="#888780" />
    </ng-container>
  </ng-container>
</svg>
